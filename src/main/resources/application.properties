spring.application.name=mobileapp
spring.datasource.url=jdbc:postgresql://localhost:5432/demo_db
spring.datasource.username=postgres
spring.datasource.password=admin123

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=Hvlxv6k1vPDKZTUn42OU/LE+1EnCBz7TrZ31kyQH6Ik=
jwt.expiration=900000
jwt.refresh.expiration=604800000

# Disable Flyway auto-migrations to avoid the "Unsupported Database: PostgreSQL 14.18" startup failure.
# If you want the DB constraint updated automatically at startup, enable the application runner below.

spring.flyway.enabled=true

# If the database already contains objects but Flyway hasn't managed it yet,
# enable baseline-on-migrate so Flyway creates its schema history table and
# treats the existing state as the baseline. This allows subsequent migrations
# (e.g. V2__) to be applied. Use with caution in production ? review migrations
# and baselineVersion if needed.
spring.flyway.baseline-on-migrate=true

# When set to true the application will run a short ALTER TABLE migration on startup to
# add VENDOR and CUSTOMER values to the `users_role_check` constraint. Default: false
app.migration.apply-role-constraint=true